<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · VideoNote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: #0b0d12; color: #e6e9ef;
    font-family: "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 380px; background: #12151c; border: 1px solid #252a36;
    border-radius: 16px; padding: 28px 26px 24px;
  }
  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; letter-spacing: .3px; }
  p.sub { margin: 0 0 20px; color: #8b93a7; font-size: 13px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: #a8b0c2; margin-bottom: 8px; }
  input {
    width: 100%; padding: 11px 12px; font-size: 15px; color: #e6e9ef;
    background: #0f1218; border: 1px solid #2b3140; border-radius: 9px; outline: none;
  }
  input:focus { border-color: #5b8def; }
  button {
    width: 100%; margin-top: 16px; padding: 11px 12px; font-size: 15px; cursor: pointer;
    color: #fff; background: #3b6fd4; border: 0; border-radius: 9px; font-weight: 600;
  }
  button:hover { background: #4a7fe4; }
  button:disabled { background: #2a3446; cursor: default; }
  .err { margin-top: 12px; min-height: 18px; font-size: 13px; color: #ff8a8a; }
  .tip { margin-top: 18px; font-size: 12px; color: #6b7387; line-height: 1.7; }
  code { background: #181c25; padding: 1px 5px; border-radius: 4px; color: #b9c2d6; }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="f">
    <h1>VideoNote</h1>
    <p class="sub">这台工作台设了密码，输入后才能进入。</p>
    <label for="pw">密码</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus />
    <button id="go" type="submit">进入</button>
    <div class="err" id="err"></div>
    <div class="tip">密码在项目根目录 <code>.env</code> 的 <code>VN_PASSWORD</code> 里。<br>
      在自己电脑上打开时通常不需要登录。</div>
  </form>
</div>
<script>
  const f = document.getElementById('f');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const err = document.getElementById('err');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    if (!pw.value) { err.textContent = '请输入密码'; return; }
    go.disabled = true;
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      if (!r.ok) {
        let d = '登录失败';
        try { d = (await r.json()).detail || d; } catch (_) {}
        err.textContent = d;
        go.disabled = false;
        return;
      }
      location.replace('/');
    } catch (ex) {
      err.textContent = '连不上服务：' + (ex.message || ex);
      go.disabled = false;
    }
  });
</script>
</body>
</html>
